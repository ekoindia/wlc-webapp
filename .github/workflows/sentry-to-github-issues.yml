name: Sentry to GitHub Issues Sync

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    name: Sync Sentry issues to GitHub
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Sync Sentry issues
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENTRY_ORG: eko-sp
          GITHUB_REPO: ekoindia/wlc-webapp
          SENTRY_PROJECTS: javascript-react,javascript
        run: python3 scripts/sentry_github_sync.py
