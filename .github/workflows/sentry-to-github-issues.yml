name: Sentry → GitHub Issues Sync

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:          # manual trigger from GitHub Actions UI

jobs:
  sync:
    name: Sync Sentry issues to GitHub
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Sync Sentry issues
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENTRY_ORG: eko-sp
          GITHUB_REPO: ekoindia/wlc-webapp
          SENTRY_PROJECTS: javascript-react,javascript
        run: |
          python3 << 'EOF'
          import os, json, urllib.request, urllib.parse, sys

          SENTRY_TOKEN  = os.environ["SENTRY_AUTH_TOKEN"]
          GITHUB_TOKEN  = os.environ["GITHUB_TOKEN"]
          SENTRY_ORG    = os.environ["SENTRY_ORG"]
          GITHUB_REPO   = os.environ["GITHUB_REPO"]
          PROJECTS      = os.environ["SENTRY_PROJECTS"].split(",")

          def sentry_get(path):
              req = urllib.request.Request(
                  f"https://sentry.io/api/0{path}",
                  headers={"Authorization": f"Bearer {SENTRY_TOKEN}"}
              )
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          def github_get(path):
              req = urllib.request.Request(
                  f"https://api.github.com{path}",
                  headers={
                      "Authorization": f"Bearer {GITHUB_TOKEN}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28"
                  }
              )
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          def github_post(path, data):
              body = json.dumps(data).encode()
              req = urllib.request.Request(
                  f"https://api.github.com{path}",
                  data=body,
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {GITHUB_TOKEN}",
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2022-11-28"
                  }
              )
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          def issue_exists(sentry_id):
              """Search GitHub issues for the Sentry ID marker."""
              q = urllib.parse.quote(f"repo:{GITHUB_REPO} is:issue sentry-id:{sentry_id}")
              results = github_get(f"/search/issues?q={q}&per_page=1")
              return results["total_count"] > 0

          def ensure_label():
              """Create the sentry label if it doesn't exist."""
              try:
                  github_get(f"/repos/{GITHUB_REPO}/labels/sentry")
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      github_post(f"/repos/{GITHUB_REPO}/labels", {
                          "name": "sentry",
                          "color": "e74c3c",
                          "description": "Issues imported from Sentry error tracking"
                      })

          def build_body(issue, project):
              sentry_id = issue["id"]
              return f"""## Sentry Error Report

<!-- sentry-id:{sentry_id} -->

| Field | Value |
|---|---|
| **Sentry ID** | [{sentry_id}]({issue['permalink']}) |
| **Project** | {project} |
| **Level** | {issue['level'].upper()} |
| **Occurrences** | {issue['count']} |
| **Users affected** | {issue['userCount']} |
| **First seen** | {issue['firstSeen'][:10]} |
| **Last seen** | {issue['lastSeen'][:10]} |
| **Culprit** | `{issue.get('culprit', 'N/A')}` |

---

### Error

```
{issue['title']}
```

---

> View full details on [Sentry]({issue['permalink']})"""

          ensure_label()
          created = 0
          skipped = 0

          for project in PROJECTS:
              print(f"\n[{project}] Fetching unresolved issues...")
              issues = sentry_get(f"/projects/{SENTRY_ORG}/{project}/issues/?query=is:unresolved&limit=50")

              for issue in issues:
                  sentry_id = issue["id"]
                  title = f"[Sentry] {issue['title']} ({project})"

                  if issue_exists(sentry_id):
                      print(f"  SKIP  #{sentry_id} — already exists")
                      skipped += 1
                      continue

                  result = github_post(f"/repos/{GITHUB_REPO}/issues", {
                      "title": title,
                      "body": build_body(issue, project),
                      "labels": ["sentry", "bug"]
                  })
                  print(f"  CREATE #{sentry_id} → {result['html_url']}")
                  created += 1

          print(f"\nDone. Created: {created} | Skipped (already exist): {skipped}")
          EOF
