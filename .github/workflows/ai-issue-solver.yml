name: 🤖 AI Issue Solver

on:
  issues:
    types: [opened, labeled]

  # Allow manual trigger from the Actions tab (useful for testing)
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to solve"
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  solve-issue:
    name: Solve Issue with AI
    runs-on: ubuntu-latest

    # Only run if:
    #   - Issue has the "ai-fix" label (so not every issue triggers this)
    #   - OR it was manually triggered
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'ai-fix')

    steps:
      # ── 1. Checkout full repo ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Set up Python ──────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      # ── 3. Resolve issue number safely ─────────────────────────────────────
      - name: Set issue number
        id: issue
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ github.event.inputs.issue_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          fi

      # ── 4. Comment on the issue that AI is working on it ──────────────────
      - name: Post "Working on it" comment
        uses: actions/github-script@v7
        env:
          ISSUE_NUM: ${{ steps.issue.outputs.number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUM, 10);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `## 🤖 AI is working on this issue...\n\nI've picked up this issue and am analyzing the codebase to generate a fix. A Pull Request will be raised shortly for human review.\n\n_Powered by [OpenRouter](https://openrouter.ai)_`
            });

      # ── 5. Run the AI fix script ──────────────────────────────────────────
      - name: Run AI Fix Script
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER:       ${{ steps.issue.outputs.number }}
          ISSUE_TITLE:        ${{ github.event.issue.title }}
          ISSUE_BODY:         ${{ github.event.issue.body }}
          REPO_NAME:          ${{ github.repository }}
        run: python scripts/ai_issue_solver.py

      # ── 6. Create branch, apply fix, raise PR ────────────────────────────
      - name: Create branch and raise PR
        if: success()
        env:
          GH_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ISSUE_TITLE:  ${{ github.event.issue.title }}
        run: |
          BRANCH="ai/fix-issue-${ISSUE_NUMBER}"

          git config user.name  "AI Fix Bot"
          git config user.email "ai-bot@users.noreply.github.com"

          # Check if branch already exists
          if git ls-remote --exit-code --heads origin "$BRANCH"; then
            echo "Branch $BRANCH already exists — deleting and recreating"
            git push origin --delete "$BRANCH" || true
          fi

          git checkout -b "$BRANCH"

          # Apply AI-generated changes (written by ai_issue_solver.py)
          if [ -f "ai_file_changes.json" ]; then
            python scripts/apply_changes.py
          else
            echo "⚠️ No file changes generated."
            exit 0
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          # Safe commit message — sanitize title to avoid shell injection
          SAFE_TITLE=$(echo "$ISSUE_TITLE" | tr -dc '[:print:]' | head -c 100)
          git commit -m "🤖 AI fix for issue #${ISSUE_NUMBER}: ${SAFE_TITLE}"
          git push origin "$BRANCH"

          # Raise the PR against dev branch
          gh pr create \
            --base dev \
            --head "$BRANCH" \
            --title "🤖 Fix for issue #${ISSUE_NUMBER}: ${SAFE_TITLE}" \
            --body "$(cat ai_pr_description.md)" \
            --label "ai-generated"
